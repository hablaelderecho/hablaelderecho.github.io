name: Verificar conexión con Meta

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar el token (no publica nada)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python bot/verificar_meta.py
